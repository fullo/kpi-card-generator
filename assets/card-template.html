<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Template Carte KPI</title>
    <meta name="author" content="Francesco Fullone">
    <!-- Questo file contiene solo i template, gli stili verranno iniettati dallo script principale -->
</head>
<body>
    <!-- TEMPLATE PER IL FRONTE DELLA CARTA -->
    <template id="card-front">
        <div class="playing-card {{styleClass}}" style="{{cardCssVars}}">
            <div class="inner-frame">
                <div class="card-header">
                    <h3 class="card-title">{{title}}</h3>
                    <div class="card-icon-container"><span>{{headerIcon}}</span></div>
                </div>
                <div class="card-image-area">{{heroImage}}</div>
                <div class="card-type-banner">{{type}}</div>
                <div class="card-description-box">
                    <p class="main-text">{{description}}</p>
                    <div class="card-flavor-text">{{flavorText}}</div>
                </div>
            </div>
        </div>
    </template>

    <!-- TEMPLATE PER IL RETRO DELLA CARTA -->
    <template id="card-back">
        <div class="playing-card {{styleClass}}">
            <div class="inner-frame card-back">
                <div class="back-icon">{{cardBackIcon}}</div>
                <div class="back-credit">{{copyright}}</div>
            </div>
        </div>
    </template>
</body>
</html>
